<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('活动详情 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-calendar-check"></i> 活动详情</h2>
            <div class="btn-group">
                <a th:href="@{/activity/list}" class="btn btn-outline btn-sm">返回列表</a>
                <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                   th:href="@{/activity/edit/{id}(id=${activity.id})}" class="btn btn-warning btn-sm">编辑</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="detail-header">
            <h1 th:text="${activity.title}"></h1>
            <div class="detail-meta">
                <span th:if="${activity.clubName != null}" th:text="'社团: ' + ${activity.clubName}"></span>
                <span th:text="'发布人: ' + ${activity.publisherName}"></span>
                <span th:text="'发布时间: ' + ${#temporals.format(activity.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                <span>
                    <span th:if="${activity.status == 0}" class="tag tag-blue">报名中</span>
                    <span th:if="${activity.status == 1}" class="tag tag-green">进行中</span>
                    <span th:if="${activity.status == 2}" class="tag tag-red">已结束</span>
                </span>
            </div>
        </div>

        <hr class="divider">

        <div class="grid-2" style="margin-bottom: 20px;">
            <div class="form-group">
                <label>活动地点</label>
                <p th:text="${activity.location != null ? activity.location : '未设置'}"></p>
            </div>
            <div class="form-group">
                <label>最大参与人数</label>
                <p th:text="${activity.maxParticipants != null ? activity.maxParticipants + '人' : '不限'}"></p>
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <p th:text="${activity.startTime != null ? #temporals.format(activity.startTime, 'yyyy-MM-dd HH:mm') : '未设置'}"></p>
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <p th:text="${activity.endTime != null ? #temporals.format(activity.endTime, 'yyyy-MM-dd HH:mm') : '未设置'}"></p>
            </div>
        </div>

        <hr class="divider">

        <div class="form-group">
            <label>活动详情</label>
            <div class="detail-body" style="white-space: pre-wrap;" th:text="${activity.content != null ? activity.content : '暂无详情'}"></div>
        </div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
