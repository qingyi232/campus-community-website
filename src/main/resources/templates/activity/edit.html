<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('编辑活动 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-pencil-square"></i> 编辑活动</h2>
            <a th:href="@{/activity/detail/{id}(id=${activity.id})}" class="btn btn-outline btn-sm">返回详情</a>
        </div>
        <form th:action="@{/activity/update}" method="post">
            <input type="hidden" name="id" th:value="${activity.id}">
            <div class="form-group">
                <label>活动名称 *</label>
                <input type="text" name="title" class="form-control" th:value="${activity.title}" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>所属社团</label>
                    <select name="clubId" class="form-control">
                        <option value="">请选择社团</option>
                        <option th:each="club : ${clubs}" th:value="${club.id}" th:text="${club.name}"
                                th:selected="${club.id == activity.clubId}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>活动地点</label>
                    <input type="text" name="location" class="form-control" th:value="${activity.location}">
                </div>
                <div class="form-group">
                    <label>开始时间</label>
                    <input type="datetime-local" name="startTime" class="form-control" th:value="${activity.startTime}">
                </div>
                <div class="form-group">
                    <label>结束时间</label>
                    <input type="datetime-local" name="endTime" class="form-control" th:value="${activity.endTime}">
                </div>
                <div class="form-group">
                    <label>最大参与人数</label>
                    <input type="number" name="maxParticipants" class="form-control" th:value="${activity.maxParticipants}">
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select name="status" class="form-control">
                        <option value="0" th:selected="${activity.status == 0}">报名中</option>
                        <option value="1" th:selected="${activity.status == 1}">进行中</option>
                        <option value="2" th:selected="${activity.status == 2}">已结束</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>活动详情</label>
                <textarea name="content" class="form-control" th:text="${activity.content}"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">保存修改</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
