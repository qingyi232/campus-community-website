<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('在线留言 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card" th:if="${session.loginUser != null}">
        <div class="card-header">
            <h2><i class="bi bi-chat-dots"></i> 发表留言</h2>
        </div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <form th:action="@{/message/save}" method="post">
            <div class="form-group">
                <textarea name="content" class="form-control" rows="4" placeholder="请输入留言内容..." required></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">提交留言</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-chat-left-text"></i> 留言列表</h2>
        </div>

        <div th:if="${#lists.isEmpty(messages)}" class="empty-state">暂无留言，快来留下第一条吧！</div>

        <div th:each="msg : ${messages}" class="message-item">
            <div class="msg-header">
                <span class="msg-user" th:text="${msg.username}"></span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="msg-time" th:text="${#temporals.format(msg.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                    <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                       th:href="@{/message/delete/{id}(id=${msg.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('确定删除？')">删除</a>
                </div>
            </div>
            <div class="msg-content" th:text="${msg.content}"></div>

            <div th:if="${msg.status == 1}" class="msg-reply">
                <div class="reply-label" th:text="'管理员 ' + ${msg.replyBy} + ' 回复:'"></div>
                <div th:text="${msg.reply}"></div>
                <div style="font-size:12px; color:#999; margin-top:4px;"
                     th:text="${#temporals.format(msg.replyTime, 'yyyy-MM-dd HH:mm')}"></div>
            </div>

            <div th:if="${msg.status == 0 and session.loginUser != null and session.loginUser.role == 2}" style="margin-top: 12px;">
                <form th:action="@{/message/reply/{id}(id=${msg.id})}" method="post" style="display:flex; gap:10px;">
                    <input type="text" name="reply" class="form-control" placeholder="输入回复内容..." required style="flex:1;">
                    <button type="submit" class="btn btn-primary btn-sm">回复</button>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
