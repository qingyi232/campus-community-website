<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">校园社团网站</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar" th:fragment="navbar">
    <a href="/" class="logo"><i class="bi bi-mortarboard-fill"></i> 校园社团网站</a>
    <div class="nav-links">
        <a th:href="@{/index}"><i class="bi bi-house"></i> 首页</a>
        <a th:href="@{/club/list}"><i class="bi bi-people"></i> 社团信息</a>
        <a th:href="@{/activity/list}"><i class="bi bi-calendar-event"></i> 活动管理</a>
        <a th:href="@{/news/list}"><i class="bi bi-newspaper"></i> 社团资讯</a>
        <a th:href="@{/notice/list}"><i class="bi bi-megaphone"></i> 通知公告</a>
        <a th:href="@{/message/list}"><i class="bi bi-chat-dots"></i> 在线留言</a>
        <a th:href="@{/member/my}" th:if="${session.loginUser != null and session.loginUser.role == 0}"><i class="bi bi-person-badge"></i> 我的社团</a>
        <a th:href="@{/admin/users}" th:if="${session.loginUser != null and session.loginUser.role == 2}"><i class="bi bi-gear"></i> 用户管理</a>
    </div>
    <div class="user-info">
        <th:block th:if="${session.loginUser != null}">
            <span><i class="bi bi-person-circle"></i> <span th:text="${session.loginUser.username}"></span></span>
            <a th:href="@{/user/profile}"><i class="bi bi-sliders"></i> 个人中心</a>
            <a th:href="@{/logout}"><i class="bi bi-box-arrow-right"></i> 退出</a>
        </th:block>
        <th:block th:unless="${session.loginUser != null}">
            <a th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i> 登录</a>
            <a th:href="@{/register}"><i class="bi bi-person-plus"></i> 注册</a>
        </th:block>
    </div>
</nav>
<footer class="footer" th:fragment="footer">
    <p>&copy; 2026 校园社团网站 - 毕业设计作品</p>
</footer>
</body>
</html>
