<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('发布公告 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-plus-circle"></i> 发布公告</h2>
            <a th:href="@{/notice/list}" class="btn btn-outline btn-sm">返回列表</a>
        </div>
        <form th:action="@{/notice/save}" method="post">
            <div class="form-group">
                <label>公告标题 *</label>
                <input type="text" name="title" class="form-control" placeholder="请输入公告标题" required>
            </div>
            <div class="form-group">
                <label>是否置顶</label>
                <select name="top" class="form-control">
                    <option value="0">否</option>
                    <option value="1">是</option>
                </select>
            </div>
            <div class="form-group">
                <label>公告内容</label>
                <textarea name="content" class="form-control" rows="10" placeholder="请输入公告内容"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">发布公告</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
