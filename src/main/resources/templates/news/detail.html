<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('资讯详情 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-file-text"></i> 资讯详情</h2>
            <div class="btn-group">
                <a th:href="@{/news/list}" class="btn btn-outline btn-sm">返回列表</a>
                <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                   th:href="@{/news/edit/{id}(id=${news.id})}" class="btn btn-warning btn-sm">编辑</a>
            </div>
        </div>

        <div class="detail-header">
            <h1 th:text="${news.title}"></h1>
            <div class="detail-meta">
                <span th:if="${news.clubName != null}" th:text="'社团: ' + ${news.clubName}"></span>
                <span th:text="'发布人: ' + ${news.publisherName}"></span>
                <span th:text="'发布时间: ' + ${#temporals.format(news.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                <span th:text="'浏览: ' + ${news.viewCount} + '次'"></span>
            </div>
        </div>

        <hr class="divider">

        <div class="detail-body" style="white-space: pre-wrap;" th:text="${news.content != null ? news.content : '暂无内容'}"></div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
