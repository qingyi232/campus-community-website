<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('发布资讯 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-plus-circle"></i> 发布资讯</h2>
            <a th:href="@{/news/list}" class="btn btn-outline btn-sm">返回列表</a>
        </div>
        <form th:action="@{/news/save}" method="post">
            <div class="form-group">
                <label>资讯标题 *</label>
                <input type="text" name="title" class="form-control" placeholder="请输入资讯标题" required>
            </div>
            <div class="form-group">
                <label>所属社团</label>
                <select name="clubId" class="form-control">
                    <option value="">请选择社团（可不选）</option>
                    <option th:each="club : ${clubs}" th:value="${club.id}" th:text="${club.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>资讯内容</label>
                <textarea name="content" class="form-control" rows="10" placeholder="请输入资讯内容"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">发布资讯</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
