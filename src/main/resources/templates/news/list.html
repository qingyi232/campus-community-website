<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('社团资讯 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-newspaper"></i> 社团资讯</h2>
            <a th:if="${session.loginUser != null and session.loginUser.role == 2}" th:href="@{/news/add}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> 发布资讯</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form class="search-bar" th:action="@{/news/list}" method="get">
            <input type="text" name="keyword" class="form-control" placeholder="搜索资讯标题..." th:value="${keyword}">
            <button type="submit" class="btn btn-primary">搜索</button>
            <a th:href="@{/news/list}" class="btn btn-outline">重置</a>
        </form>

        <div th:if="${#lists.isEmpty(newsList)}" class="empty-state">暂无资讯</div>

        <div th:unless="${#lists.isEmpty(newsList)}">
            <div th:each="news : ${newsList}" class="list-item">
                <div>
                    <a th:href="@{/news/detail/{id}(id=${news.id})}" class="item-title" th:text="${news.title}"></a>
                    <span style="margin-left: 10px;" class="tag tag-blue" th:if="${news.clubName != null}" th:text="${news.clubName}"></span>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <span class="item-meta" th:text="'浏览: ' + ${news.viewCount}"></span>
                    <span class="item-meta" th:text="${#temporals.format(news.createTime, 'yyyy-MM-dd')}"></span>
                    <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                       th:href="@{/news/delete/{id}(id=${news.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('确定删除？')">删除</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
