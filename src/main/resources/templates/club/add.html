<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('创建社团 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-plus-circle"></i> 创建社团</h2>
            <a th:href="@{/club/list}" class="btn btn-outline btn-sm">返回列表</a>
        </div>
        <form th:action="@{/club/save}" method="post">
            <div class="grid-2">
                <div class="form-group">
                    <label>社团名称 *</label>
                    <input type="text" name="name" class="form-control" placeholder="请输入社团名称" required>
                </div>
                <div class="form-group">
                    <label>社团类别</label>
                    <select name="category" class="form-control">
                        <option value="学术科技">学术科技</option>
                        <option value="文化艺术">文化艺术</option>
                        <option value="体育运动">体育运动</option>
                        <option value="志愿公益">志愿公益</option>
                        <option value="创新创业">创新创业</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>社长姓名</label>
                    <input type="text" name="president" class="form-control" placeholder="请输入社长姓名">
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input type="text" name="contactPhone" class="form-control" placeholder="请输入联系电话">
                </div>
            </div>
            <div class="form-group">
                <label>社团简介</label>
                <textarea name="description" class="form-control" placeholder="请输入社团简介"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">提交创建</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
