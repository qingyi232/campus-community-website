<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('社团详情 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-people-fill"></i> <span th:text="${club.name}">社团名称</span></h2>
            <div class="btn-group">
                <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                   th:href="@{/club/edit/{id}(id=${club.id})}" class="btn btn-warning btn-sm">编辑</a>
                <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
                   th:href="@{/club/delete/{id}(id=${club.id})}" class="btn btn-danger btn-sm"
                   onclick="return confirm('确定删除该社团？')">删除</a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="grid-2">
            <div>
                <div class="form-group">
                    <label>社团类别</label>
                    <p th:text="${club.category != null ? club.category : '未分类'}"></p>
                </div>
                <div class="form-group">
                    <label>社长</label>
                    <p th:text="${club.president != null ? club.president : '未设置'}"></p>
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <p th:text="${club.contactPhone != null ? club.contactPhone : '未设置'}"></p>
                </div>
            </div>
            <div>
                <div class="form-group">
                    <label>成员人数</label>
                    <p th:text="${memberCount} + '人'"></p>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <p>
                        <span th:if="${club.status == 1}" class="tag tag-green">正常</span>
                        <span th:if="${club.status == 0}" class="tag tag-orange">待审核</span>
                        <span th:if="${club.status == 2}" class="tag tag-red">已解散</span>
                    </p>
                </div>
                <div class="form-group">
                    <label>创建时间</label>
                    <p th:text="${#temporals.format(club.createTime, 'yyyy-MM-dd HH:mm')}"></p>
                </div>
            </div>
        </div>

        <hr class="divider">

        <div class="form-group">
            <label>社团简介</label>
            <div class="detail-body" th:text="${club.description != null ? club.description : '暂无简介'}"></div>
        </div>

        <hr class="divider">

        <div th:if="${session.loginUser != null and !isMember and club.status == 1}">
            <form th:action="@{/club/join/{id}(id=${club.id})}" method="post" style="margin-top: 16px;">
                <button type="submit" class="btn btn-success">申请加入社团</button>
            </form>
        </div>

        <div th:if="${isMember}" class="alert alert-info" style="margin-top: 16px;">您已经是该社团成员</div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-person-lines-fill"></i> 社团成员</h2>
            <a th:if="${session.loginUser != null and session.loginUser.role == 2}"
               th:href="@{/member/list(clubId=${club.id})}" class="btn btn-outline btn-sm">管理成员</a>
        </div>
        <div th:if="${#lists.isEmpty(members)}" class="empty-state">暂无成员</div>
        <div class="table-wrapper" th:unless="${#lists.isEmpty(members)}">
            <table>
                <thead>
                <tr>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>职位</th>
                    <th>加入时间</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.username}"></td>
                    <td th:text="${member.realName != null ? member.realName : '-'}"></td>
                    <td><span class="tag tag-blue" th:text="${member.position}"></span></td>
                    <td th:text="${#temporals.format(member.joinTime, 'yyyy-MM-dd')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
