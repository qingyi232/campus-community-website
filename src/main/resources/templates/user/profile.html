<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('个人中心 - 校园社团网站')"></head>
<body>
<nav th:replace="fragments/header :: navbar"></nav>

<div class="main-content">
    <div class="card">
        <div class="card-header">
            <h2><i class="bi bi-person-circle"></i> 个人中心</h2>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form th:action="@{/user/update}" method="post">
            <div class="grid-2">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <input type="text" class="form-control" disabled
                           th:value="${user.role == 2 ? '系统管理员' : (user.role == 1 ? '社团管理员' : '普通用户')}">
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" name="realName" class="form-control" th:value="${user.realName}" placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label>学号</label>
                    <input type="text" name="studentNo" class="form-control" th:value="${user.studentNo}" placeholder="请输入学号">
                </div>
                <div class="form-group">
                    <label>院系</label>
                    <input type="text" name="department" class="form-control" th:value="${user.department}" placeholder="请输入院系">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" name="phone" class="form-control" th:value="${user.phone}" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" name="email" class="form-control" th:value="${user.email}" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select name="gender" class="form-control">
                        <option value="男" th:selected="${user.gender == '男'}">男</option>
                        <option value="女" th:selected="${user.gender == '女'}">女</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>注册时间</label>
                <input type="text" class="form-control" th:value="${#temporals.format(user.createTime, 'yyyy-MM-dd HH:mm:ss')}" disabled>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">保存修改</button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="fragments/header :: footer"></footer>
</body>
</html>
